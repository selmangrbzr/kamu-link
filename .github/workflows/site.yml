name: Site

# Scraper ve enricher'dan sonra (UTC) siteyi yeniden üretir ve GitHub Pages'e yayınlar.
# Repo ayarında Pages kaynağı "GitHub Actions" olmalıdır.
on:
  schedule:
    - cron: "30 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testler
        run: |
          python -m pip install --quiet "pytest>=8"
          python -m pytest -q

      - name: Siteyi üret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m uretec --cikti _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
