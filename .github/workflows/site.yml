name: Site

# Scraper ve enricher'dan sonra (UTC) siteyi yeniden üretir ve GitHub Pages'e yayınlar.
# Repo ayarında Pages kaynağı "GitHub Actions" olmalıdır.
on:
  schedule:
    - cron: "30 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Testler
        run: |
          python -m pip install --quiet "pytest>=8"
          python -m pytest -q

      # IndexNow karşılaştırması için yayındaki sitemap üretimden ÖNCE alınır.
      - name: Önceki sitemap'i indir
        run: |
          mkdir -p indexnow
          curl -fsSL --max-time 30 -o indexnow/onceki.xml https://kamuuygulama.me/sitemap.xml || echo "Önceki sitemap alınamadı; tüm adresler yeni sayılacak."

      - name: Siteyi üret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m uretec --cikti _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: IndexNow girdilerini sakla
        run: cp _site/sitemap.xml indexnow/yeni.xml

      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Yayından sonra yalnızca yeni ya da lastmod'u değişen adresleri IndexNow'a bildirir.
  # Hata iş akışını düşürmez.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: indexnow
          path: indexnow

      - name: IndexNow bildir
        run: python -m uretec.indexnow --eski indexnow/onceki.xml --yeni indexnow/yeni.xml
